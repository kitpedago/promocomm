# PromoComm — production chez le client (Debian + Docker).
# Emplacement : /opt/docker/promocomm/ avec un .env rempli depuis .env.example.
#
#   docker compose up -d        # démarrer / appliquer les changements
#   ./update.sh                 # mettre à jour l'image et redémarrer
#
# Aucun build ici : l'image est construite sur le PC de dev (scripts/release.ps1)
# et publiée sur le registry Gitea git.gd.solutions.
#
# Les ${VAR:?…} refusent le démarrage si la variable est vide dans .env.
# Adaptations locales (reverse proxy, ports…) : docker-compose.override.yml,
# jamais ce fichier, qui est remplacé à chaque livraison.
services:
  promocomm-db:
    image: postgres:16-alpine
    container_name: promocomm-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER manquant dans .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant dans .env}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB manquant dans .env}
      APP_DB_USER: ${APP_DB_USER:?APP_DB_USER manquant dans .env}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?APP_DB_PASSWORD manquant dans .env}
    # Aucun port publié : PostgreSQL n'est joignable que par l'application.
    # Ouverture ponctuelle (outils BI sur le miroir, copie prod → dev) : README.
    volumes:
      - promocomm-db-data:/var/lib/postgresql/data
      # premier démarrage seulement : compte applicatif sans SUPERUSER
      - ./init-app-role.sh:/docker-entrypoint-initdb.d/init-app-role.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  promocomm-app:
    image: git.gd.solutions/gducos/promocomm:${PROMOCOMM_TAG:-latest}
    container_name: promocomm-app
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${APP_DB_USER}:${APP_DB_PASSWORD}@promocomm-db:5432/${POSTGRES_DB}
      BETTER_AUTH_URL: ${APP_URL:?APP_URL manquant dans .env}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET manquant dans .env}
      TRUSTED_ORIGINS: ${TRUSTED_ORIGINS:-}
      MIROIR_DB: ${MIROIR_DB:-}
      TZ: Europe/Paris
    ports:
      # Accès direct depuis le LAN. Derrière un reverse proxy : supprimer via
      # l'override (ports: !reset []) et brancher le proxy sur le port 3000.
      - "3020:3000"
    depends_on:
      promocomm-db:
        condition: service_healthy

volumes:
  promocomm-db-data:
    # Nom explicite (pas de préfixe projet) : /var/lib/docker/volumes/promocomm-db-data
    name: promocomm-db-data
