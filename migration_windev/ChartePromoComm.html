  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

ng: 4px 10px 8px 10px;\">Pilotage<\u002Fdiv>\n      <a href=\"#\" style=\"display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 8px; text-decoration: none; color: #5A5F73; font-size: 14px; font-weight: 500;\" style-hover=\"background: #F4F3EF; color: #232B49;\">\n        <span style=\"width: 7px; height: 7px; border-radius: 2px; background: #C9C6BC; flex-shrink: 0;\"><\u002Fspan>Tableau de bord\n      <\u002Fa>\n      <a href=\"Gestion Opérations.dc.html\" style=\"display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 8px; text-decoration: none; color: #5A5F73; font-size: 14px; font-weight: 500;\" style-hover=\"background: #F4F3EF; color: #232B49;\">\n        <span style=\"width: 7px; height: 7px; border-radius: 2px; background: #C9C6BC; flex-shrink: 0;\"><\u002Fspan>Opérations\n      <\u002Fa>\n      <a href=\"#\" style=\"display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 8px; text-decoration: none; color: #FFFFFF; font-size: 14px; font-weight: 600; background: #232B49;\">\n        <span style=\"width: 7px; height: 7px; border-radius: 2px; background: #F5B841; flex-shrink: 0;\"><\u002Fspan>Compta &amp; Finances\n      <\u002Fa>\n      <a href=\"#\" style=\"display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 8px; text-decoration: none; color: #5A5F73; font-size: 14px; font-weight: 500;\" style-hover=\"background: #F4F3EF; color: #232B49;\">\n        <span style=\"width: 7px; height: 7px; border-radius: 2px; background: #C9C6BC; flex-shrink: 0;\"><\u002Fspan>Lots &amp; réservations\n      <\u002Fa>\n      <a href=\"#\" style=\"display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 8px; text-decoration: none; color: #5A5F73; font-size: 14px; font-weight: 500;\" style-hover=\"background: #F4F3EF; color: #232B49;\">\n        <span style=\"width: 7px; height: 7px; border-radius: 2px; background: #C9C6BC; flex-shrink: 0;\"><\u002Fspan>Coopérateurs\n      <\u002Fa>\n      <div style=\"font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: #9A97A8; font-weight: 600; padding: 18px 10px 8px 10px;\">Support<\u002Fdiv>\n      <a href=\"#\" style=\"display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 8px; text-decoration: none; color: #5A5F73; font-size: 14px; font-weight: 500;\" style-hover=\"background: #F4F3EF; color: #232B49;\">\n        <span style=\"width: 7px; height: 7px; border-radius: 2px; background: #C9C6BC; flex-shrink: 0;\"><\u002Fspan>Documents\n      <\u002Fa>\n      <a href=\"#\" style=\"display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 8px; text-decoration: none; color: #5A5F73; font-size: 14px; font-weight: 500;\" style-hover=\"background: #F4F3EF; color: #232B49;\">\n        <span style=\"width: 7px; height: 7px; border-radius: 2px; background: #C9C6BC; flex-shrink: 0;\"><\u002Fspan>Paramètres\n      <\u002Fa>\n    <\u002Fnav>\n    <div style=\"margin: 12px; padding: 10px 12px; background: #F4F3EF; border-radius: 10px; display: flex; align-items: center; gap: 10px;\">\n      <div style=\"width: 32px; height: 32px; border-radius: 50%; background: #232B49; color: #F5B841; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; flex-shrink: 0;\">ML<\u002Fdiv>\n      <div style=\"min-width: 0;\">\n        <div style=\"font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;\">Marie Le Gall<\u002Fdiv>\n        <div style=\"font-size: 11.5px; color: #9A97A8;\">Resp. programmes<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Faside>\n\n  <!-- ============ MASTER PANEL : OPÉRATIONS ============ -->\n  <section style=\"width: 264px; flex-shrink: 0; background: #FBFAF7; border-right: 1px solid #E7E4DC; display: flex; flex-direction: column; min-height: 0;\">\n    <div style=\"padding: 18px 16px 12px 16px;\">\n      <div style=\"font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: #9A97A8; font-weight: 700;\">Compta &amp; Finances<\u002Fdiv>\n      <div style=\"font-size: 16px; font-weight: 700; margin-top: 3px;\">{{ opCount }} opérations<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"padding: 0 16px 12px 16px;\">\n      <div style=\"position: relative;\">\n        <span style=\"position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: #9A97A8; font-size: 13px;\">⌕<\u002Fspan>\n        <input value=\"{{ opSearch }}\" onchange=\"{{ onOpSearch }}\" placeholder=\"Nom, SCCV, commune…\" style=\"width: 100%; padding: 8px 10px 8px 28px; border: 1px solid #E0DDD4; border-radius: 8px; font-size: 13px; color: #232B49; background: #FFFFFF; outline: none;\" style-focus=\"border-color: #232B49;\">\n      <\u002Fdiv>\n      <label style=\"display: flex; align-items: center; gap: 7px; margin-top: 9px; font-size: 12.5px; color: #5A5F73; cursor: pointer;\">\n        <input type=\"checkbox\" checked=\"{{ showMasked }}\" onchange=\"{{ onShowMasked }}\" style=\"accent-color: #232B49; width: 14px; height: 14px; margin: 0;\">Inclure les masqués comptables\n      <\u002Flabel>\n    <\u002Fdiv>\n    <div style=\"overflow-y: auto; flex: 1; padding: 0 10px 12px 10px; display: flex; flex-direction: column; gap: 1px;\">\n      <sc-for list=\"{{ opList }}\" as=\"o\" hint-placeholder-count=\"10\">\n        <button onclick=\"{{ o.onSelect }}\" style=\"display: flex; align-items: center; justify-content: space-between; gap: 8px; width: 100%; text-align: left; border: none; background: {{ o.bg }}; color: {{ o.fg }}; padding: 9px 12px; border-radius: 8px; cursor: pointer;\" style-hover=\"background: {{ o.hoverBg }};\">\n          <span style=\"font-size: 13.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;\">{{ o.nom }}<\u002Fspan>\n          <span style=\"font-size: 11.5px; color: {{ o.subFg }}; white-space: nowrap; text-transform: uppercase; letter-spacing: 0.04em;\">{{ o.commune }}<\u002Fspan>\n        <\u002Fbutton>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============ DETAIL ============ -->\n  <main style=\"flex: 1; display: flex; flex-direction: column; min-width: 0; overflow-y: auto;\">\n\n    <!-- Header opération + tranche -->\n    <header style=\"padding: 20px 28px 0 28px;\">\n      <div style=\"display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; flex-wrap: wrap;\">\n        <div>\n          <div style=\"font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: #C99A2B; font-weight: 700;\">Opération<\u002Fdiv>\n          <h1 style=\"margin: 3px 0 0 0; font-size: 21px; font-weight: 700; letter-spacing: -0.01em;\">{{ opTitle }}<\u002Fh1>\n        <\u002Fdiv>\n        <div style=\"display: flex; align-items: center; gap: 8px;\">\n          <span style=\"font-size: 12.5px; color: #7A7E8F; font-weight: 600;\">Tranche<\u002Fspan>\n          <select value=\"{{ tranche }}\" onchange=\"{{ onTranche }}\" style=\"padding: 9px 10px; border: 1px solid #E0DDD4; border-radius: 8px; font-size: 13px; color: #232B49; background: #FFFFFF; cursor: pointer; outline: none; max-width: 420px;\">\n            <option value=\"c3\">COLLECTIF 18 LOGTS C3 — Coll. 18 dont PSLA 8, BRS 0<\u002Foption>\n            <option value=\"c2\">COLLECTIF 24 LOGTS C2 — Coll. 24 dont PSLA 12, BRS 4<\u002Foption>\n            <option value=\"ind\">INDIVIDUELS 6 LOGTS — Indiv. 6 dont PSLA 2<\u002Foption>\n          <\u002Fselect>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- Tabs modules -->\n      <div style=\"display: flex; gap: 4px; margin-top: 18px; border-bottom: 2px solid #E7E4DC; overflow-x: auto; scrollbar-width: thin;\">\n        <sc-for list=\"{{ tabs }}\" as=\"t\" hint-placeholder-count=\"5\">\n          <button onclick=\"{{ t.onClick }}\" style=\"border: none; background: none; cursor: pointer; padding: 9px 14px 11px 14px; font-size: 13.5px; font-weight: {{ t.weight }}; color: {{ t.fg }}; border-bottom: 3px solid {{ t.underline }}; margin-bottom: -2px; white-space: nowrap; flex-shrink: 0;\" style-hover=\"color: #232B49;\">{{ t.label }}<\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fheader>\n\n    <!-- ===== Onglet GFA ===== -->\n    <sc-if value=\"{{ isGfa }}\" hint-placeholder-val=\"{{ true }}\">\n      <div style=\"padding: 20px 28px 28px 28px; display: flex; flex-direction: column; gap: 20px;\">\n\n        <!-- Admin GFA -->\n        <section style=\"background: #FFFFFF; border: 1px solid #E7E4DC; border-radius: 12px; overflow: hidden;\">\n          <div style=\"display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 18px; border-bottom: 1px solid #EFEDE6;\">\n            <div style=\"display: flex; align-items: baseline; gap: 10px;\">\n              <h2 style=\"margin: 0; font-size: 15.5px; font-weight: 700;\">Admin GFA<\u002Fh2>\n              <span style=\"font-size: 12px; color: #9A97A8;\">Garantie financière d'achèvement<\u002Fspan>\n            <\u002Fdiv>\n            <button onclick=\"{{ openNewGfa }}\" style=\"display: flex; align-items: center; gap: 7px; background: #F5B841; color: #232B49; border: none; border-radius: 8px; padding: 8px 14px; font-size: 13px; font-weight: 700; cursor: pointer;\" style-hover=\"background: #EFAB27;\"><span style=\"font-size: 15px; line-height: 1;\">+<\u002Fspan>Nouveau<\u002Fbutton>\n          <\u002Fdiv>\n          <div style=\"overflow-x: auto;\">\n            <div style=\"min-width: 1020px;\">\n              <!-- Bande de groupes -->\n              <div style=\"display: grid; grid-template-columns: 1.3fr 2fr 0.85fr 0.85fr 0.9fr 0.8fr 0.9fr 0.85fr 88px; gap: 12px; padding: 8px 18px 0 18px; font-size: 10.5px; letter-spacing: 0.1em; text-transform: uppercase; color: #C99A2B; font-weight: 700;\">\n                <div style=\"grid-column: span 2; border-bottom: 2px solid #F5B841; padding-bottom: 6px;\">Choix GFA<\u002Fdiv>\n                <div style=\"grid-column: span 3; border-bottom: 2px solid #C9C6BC; padding-bottom: 6px; color: #7A7E8F;\">Dates action organisme<\u002Fdiv>\n                <div style=\"grid-column: span 2; border-bottom: 2px solid #C9C6BC; padding-bottom: 6px; color: #7A7E8F;\">Promoteur GFA<\u002Fdiv>\n                <div style=\"border-bottom: 2px solid #C9C6BC; padding-bottom: 6px; color: #7A7E8F;\">Signature<\u002Fdiv>\n                <div><\u002Fdiv>\n              <\u002Fdiv>\n              <!-- En-têtes colonnes -->\n              <div style=\"display: grid; grid-template-columns: 1.3fr 2fr 0.85fr 0.85fr 0.9fr 0.8fr 0.9fr 0.85fr 88px; gap: 12px; align-items: center; padding: 9px 18px; border-bottom: 1px solid #E7E4DC; background: #FBFAF7; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: #7A7E8F; font-weight: 700;\">\n                <div>Organisme<\u002Fdiv>\n                <div>Commentaires<\u002Fdiv>\n                <div>Envoi dossier<\u002Fdiv>\n                <div>Accord<\u002Fdiv>\n                <div>Attestation<\u002Fdiv>\n                <div style=\"text-align: right;\">Apport<\u002Fdiv>\n                <div>Statut<\u002Fdiv>\n                <div>Date<\u002Fdiv>\n                <div><\u002Fdiv>\n              <\u002Fdiv>\n              <sc-for list=\"{{ gfaRows }}\" as=\"g\" hint-placeholder-count=\"2\">\n                <div style=\"display: grid; grid-template-columns: 1.3fr 2fr 0.85fr 0.85fr 0.9fr 0.8fr 0.9fr 0.85fr 88px; gap: 12px; align-items: center; padding: 11px 18px; border-bottom: 1px solid #F0EEE7; font-size: 13px;\" style-hover=\"background: #F8F6F0;\">\n                  <div style=\"font-weight: 600;\">{{ g.organisme }}<\u002Fdiv>\n                  <div style=\"color: #5A5F73; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;\">{{ g.commentaires }}<\u002Fdiv>\n                  <div style=\"font-variant-numeric: tabular-nums; color: #5A5F73;\">{{ g.envoi }}<\u002Fdiv>\n                  <div style=\"font-variant-numeric: tabular-nums; color: #5A5F73;\">{{ g.accord }}<\u002Fdiv>\n                  <div style=\"font-variant-numeric: tabular-nums; color: #5A5F73;\">{{ g.attestation }}<\u002Fdiv>\n                  <div style=\"text-align: right; font-variant-numeric: tabular-nums;\">{{ g.apport }}<\u002Fdiv>\n                  <div>\n                    <span style=\"display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; font-weight: 600; padding: 3px 9px; border-radius: 999px; background: {{ g.badgeBg }}; color: {{ g.badgeFg }};\">{{ g.statut }}<\u002Fspan>\n                  <\u002Fdiv>\n                  <div style=\"font-variant-numeric: tabular-nums; color: #5A5F73;\">{{ g.date }}<\u002Fdiv>\n                  <div style=\"display: flex; gap: 4px; justify-content: flex-end;\">\n                    <button onclick=\"{{ g.onEdit }}\" title=\"Modifier\" style=\"width: 28px; height: 28px; border: 1px solid #E0DDD4; background: #FFFFFF; border-radius: 7px; cursor: pointer; color: #5A5F73; font-size: 12px;\" style-hover=\"border-color: #232B49; color: #232B49;\">✎<\u002Fbutton>\n                    <button onclick=\"{{ g.onDelete }}\" title=\"Supprimer\" style=\"width: 28px; height: 28px; border: 1px solid #E0DDD4; background: #FFFFFF; border-radius: 7px; cursor: pointer; color: #B4432E; font-size: 12px;\" style-hover=\"border-color: #B4432E; background: #FAF0ED;\">🗑<\u002Fbutton>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n              <sc-if value=\"{{ gfaEmpty }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"padding: 32px 20px; text-align: center; color: #9A97A8; font-size: 13.5px;\">Aucune GFA saisie pour cette tranche.<\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsection>\n\n        <!-- Conditions financières + Réductions -->\n        <div style=\"display: grid; grid-template-columns: minmax(0, 2fr) minmax(260px, 1fr); gap: 20px; align-items: start;\">\n\n          <section style=\"background: #FFFFFF; border: 1px solid #E7E4DC; border-radius: 12px; overflow: hidden;\">\n            <div style=\"display: flex; align-items: baseline; gap: 10px; padding: 14px 18px; border-bottom: 1px solid #EFEDE6;\">\n              <h2 style=\"margin: 0; font-size: 15.5px; font-weight: 700;\">Conditions financières<\u002Fh2>\n              <span style=\"font-size: 12px; color: #9A97A8;\">GFA<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"display: grid; grid-template-columns: 0.8fr 0.7fr 1.3fr 0.8fr 2fr; gap: 12px; align-items: center; padding: 9px 18px; border-bottom: 1px solid #E7E4DC; background: #FBFAF7; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: #7A7E8F; font-weight: 700;\">\n              <div>HF caution<\u002Fdiv>\n              <div style=\"text-align: right;\">Taux<\u002Fdiv>\n              <div>Période<\u002Fdiv>\n              <div style=\"text-align: right;\">Durée<\u002Fdiv>\n              <div>Commentaires<\u002Fdiv>\n            <\u002Fdiv>\n            <sc-for list=\"{{ condRows }}\" as=\"c\" hint-placeholder-count=\"1\">\n              <div style=\"display: grid; grid-template-columns: 0.8fr 0.7fr 1.3fr 0.8fr 2fr; gap: 12px; align-items: center; padding: 11px 18px; border-bottom: 1px solid #F0EEE7; font-size: 13px;\" style-hover=\"background: #F8F6F0;\">\n                <div>{{ c.hf }}<\u002Fdiv>\n                <div style=\"text-align: right; font-weight: 700; font-variant-numeric: tabular-nums;\">{{ c.taux }}<\u002Fdiv>\n                <div style=\"color: #5A5F73;\">{{ c.periode }}<\u002Fdiv>\n                <div style=\"text-align: right; font-variant-numeric: tabular-nums; color: #5A5F73;\">{{ c.duree }}<\u002Fdiv>\n                <div style=\"color: #5A5F73; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;\">{{ c.commentaires }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fsection>\n\n          <section style=\"background: #FFFFFF; border: 1px solid #E7E4DC; border-radius: 12px; overflow: hidden;\">\n            <div style=\"display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 14px 18px; border-bottom: 1px solid #EFEDE6;\">\n              <h2 style=\"margin: 0; font-size: 15.5px; font-weight: 700;\">Réductions<\u002Fh2>\n              <span style=\"font-size: 12.5px; font-weight: 700; color: #C99A2B; font-variant-numeric: tabular-nums;\">{{ reducTotal }}<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 12px; align-items: center; padding: 9px 18px; border-bottom: 1px solid #E7E4DC; background: #FBFAF7; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: #7A7E8F; font-weight: 700;\">\n              <div style=\"text-align: right;\">Montant<\u002Fdiv>\n              <div>Date<\u002Fdiv>\n            <\u002Fdiv>\n            <sc-for list=\"{{ reducRows }}\" as=\"r\" hint-placeholder-count=\"2\">\n              <div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 12px; align-items: center; padding: 10px 18px; border-bottom: 1px solid #F0EEE7; font-size: 13px;\" style-hover=\"background: #F8F6F0;\">\n                <div style=\"text-align: right; font-variant-numeric: tabular-nums; font-weight: 600;\">{{ r.montant }}<\u002Fdiv>\n                <div style=\"color: #5A5F73; font-variant-numeric: tabular-nums;\">{{ r.date }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fsection>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- ===== Autres onglets ===== -->\n    <sc-if value=\"{{ isOtherTab }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"margin: 20px 28px; background: #FFFFFF; border: 1px dashed #D8D4C8; border-radius: 12px; padding: 56px 24px; text-align: center;\">\n        <div style=\"font-size: 15px; font-weight: 700; color: #5A5F73;\">Module « {{ activeTabLabel }} »<\u002Fdiv>\n        <div style=\"font-size: 13px; color: #9A97A8; margin-top: 6px;\">Même gabarit : tables denses à en-têtes groupés, actions par ligne, modale d'édition.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Fmain>\n\n  <!-- ============ MODALE GFA ============ -->\n  <sc-if value=\"{{ modalOpen }}\" hint-placeholder-val=\"{{ false }}\">\n    <div onclick=\"{{ closeModal }}\" style=\"position: fixed; inset: 0; background: rgba(35,43,73,0.45); backdrop-filter: blur(2px); z-index: 100; display: flex; align-items: center; justify-content: center; padding: 24px; animation: kd-overlay-in 0.15s ease-out;\">\n      <div onclick=\"{{ stopProp }}\" style=\"background: #FFFFFF; border-radius: 16px; width: 640px; max-width: 100%; max-height: 90vh; overflow-y: auto; box-shadow: 0 24px 64px rgba(20,25,45,0.35); animation: kd-modal-in 0.18s ease-out;\">\n        <div style=\"display: flex; align-items: flex-start; justify-content: space-between; padding: 22px 26px 0 26px;\">\n          <div>\n            <div style=\"font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: #C99A2B; font-weight: 700;\">{{ modalKicker }}<\u002Fdiv>\n            <h2 style=\"margin: 4px 0 0 0; font-size: 19px; font-weight: 700;\">{{ modalTitle }}<\u002Fh2>\n          <\u002Fdiv>\n          <button onclick=\"{{ closeModal }}\" style=\"width: 32px; height: 32px; border: none; background: #F4F3EF; border-radius: 8px; cursor: pointer; color: #5A5F73; font-size: 15px; line-height: 1;\" style-hover=\"background: #E9E6DC; color: #232B49;\">✕<\u002Fbutton>\n        <\u002Fdiv>\n        <div style=\"padding: 20px 26px; display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 14px 16px;\">\n          <label style=\"grid-column: span 2; display: flex; flex-direction: column; gap: 6px;\">\n            <span style=\"font-size: 12px; font-weight: 700; color: #5A5F73; letter-spacing: 0.04em; text-transform: uppercase;\">Organisme<\u002Fspan>\n            <select value=\"{{ form.organisme }}\" onchange=\"{{ onFormOrganisme }}\" style=\"padding: 10px 12px; border: 1px solid #E0DDD4; border-radius: 8px; font-size: 14px; color: #232B49; background: #FBFAF7; cursor: pointer; outline: none;\">\n              <option value=\"Caisse d'Épargne\">Caisse d'Épargne<\u002Foption>\n              <option value=\"Crédit Agricole\">Crédit Agricole<\u002Foption>\n              <option value=\"Crédit Mutuel Arkéa\">Crédit Mutuel Arkéa<\u002Foption>\n              <option value=\"SMABTP\">SMABTP<\u002Foption>\n            <\u002Fselect>\n          <\u002Flabel>\n          <label style=\"display: flex; flex-direction: column; gap: 6px;\">\n            <span style=\"font-size: 12px; font-weight: 700; color: #5A5F73; letter-spacing: 0.04em; text-transform: uppercase;\">Statut promoteur<\u002Fspan>\n            <select value=\"{{ form.statut }}\" onchange=\"{{ onFormStatut }}\" style=\"padding: 10px 12px; border: 1px solid #E0DDD4; border-radius: 8px; font-size: 14px; color: #232B49; background: #FBFAF7; cursor: pointer; outline: none;\">\n              <option value=\"En cours\">En cours<\u002Foption>\n              <option value=\"Accordée\">Accordée<\u002Foption>\n              <option value=\"Levée\">Levée<\u002Foption>\n            <\u002Fselect>\n          <\u002Flabel>\n          <label style=\"display: flex; flex-direction: column; gap: 6px;\">\n            <span style=\"font-size: 12px; font-weight: 700; color: #5A5F73; letter-spacing: 0.04em; text-transform: uppercase;\">Envoi dossier<\u002Fspan>\n            <input value=\"{{ form.envoi }}\" onchange=\"{{ onFormEnvoi }}\" type=\"date\" style=\"padding: 9px 12px; border: 1px solid #E0DDD4; border-radius: 8px; font-size: 13.5px; color: #232B49; background: #FBFAF7; outline: none;\" style-focus=\"border-color: #232B49; background: #FFFFFF;\">\n          <\u002Flabel>\n          <label style=\"display: flex; flex-direction: column; gap: 6px;\">\n            <span style=\"font-size: 12px; font-weight: 700; color: #5A5F73; letter-spacing: 0.04em; text-transform: uppercase;\">Accord<\u002Fspan>\n            <input value=\"{{ form.accord }}\" onchange=\"{{ onFormAccord }}\" type=\"date\" style=\"padding: 9px 12px; border: 1px solid #E0DDD4; border-radius: 8px; font-size: 13.5px; color: #232B49; background: #FBFAF7; outline: none;\" style-focus=\"border-color: #232B49; background: #FFFFFF;\">\n          <\u002Flabel>\n          <label style=\"display: flex; flex-direction: column; gap: 6px;\">\n            <span style=\"font-size: 12px; font-weight: 700; color: #5A5F73; letter-spacing: 0.04em; text-transform: uppercase;\">Attestation<\u002Fspan>\n            <input value=\"{{ form.attestation }}\" onchange=\"{{ onFormAttestation }}\" type=\"date\" style=\"padding: 9px 12px; border: 1px solid #E0DDD4; border-radius: 8px; font-size: 13.5px; color: #232B49; background: #FBFAF7; outline: none;\" style-focus=\"border-color: #232B49; background: #FFFFFF;\">\n          <\u002Flabel>\n          <label style=\"display: flex; flex-direction: column; gap: 6px;\">\n            <span style=\"font-size: 12px; font-weight: 700; color: #5A5F73; letter-spacing: 0.04em; text-transform: uppercase;\">Apport (€)<\u002Fspan>\n            <input value=\"{{ form.apport }}\" onchange=\"{{ onFormApport }}\" type=\"number\" min=\"0\" style=\"padding: 10px 12px; border: 1px solid #E0DDD4; border-radius: 8px; font-size: 14px; color: #232B49; background: #FBFAF7; outline: none;\" style-focus=\"border-color: #232B49; background: #FFFFFF;\">\n          <\u002Flabel>\n          <label style=\"grid-column: span 2; display: flex; flex-direction: column; gap: 6px;\">\n            <span style=\"font-size: 12px; font-weight: 700; color: #5A5F73; letter-spacing: 0.04em; text-transform: uppercase;\">Date signature<\u002Fspan>\n            <input value=\"{{ form.date }}\" onchange=\"{{ onFormDate }}\" type=\"date\" style=\"padding: 9px 12px; border: 1px solid #E0DDD4; border-radius: 8px; font-size: 13.5px; color: #232B49; background: #FBFAF7; outline: none;\" style-focus=\"border-color: #232B49; background: #FFFFFF;\">\n          <\u002Flabel>\n          <label style=\"grid-column: 1 / -1; display: flex; flex-direction: column; gap: 6px;\">\n            <span style=\"font-size: 12px; font-weight: 700; color: #5A5F73; letter-spacing: 0.04em; text-transform: uppercase;\">Commentaires<\u002Fspan>\n            <textarea value=\"{{ form.commentaires }}\" onchange=\"{{ onFormCommentaires }}\" rows=\"3\" placeholder=\"Ex. attestation d'achèvement reçue le…\" style=\"padding: 10px 12px; border: 1px solid #E0DDD4; border-radius: 8px; font-size: 14px; color: #232B49; background: #FBFAF7; outline: none; resize: vertical;\" style-focus=\"border-color: #232B49; background: #FFFFFF;\"><\u002Ftextarea>\n          <\u002Flabel>\n        <\u002Fdiv>\n        <div style=\"display: flex; align-items: center; justify-content: flex-end; gap: 10px; padding: 0 26px 22px 26px;\">\n          <button onclick=\"{{ closeModal }}\" style=\"padding: 10px 18px; border: 1px solid #E0DDD4; background: #FFFFFF; border-radius: 9px; font-size: 14px; font-weight: 600; color: #5A5F73; cursor: pointer;\" style-hover=\"border-color: #232B49; color: #232B49;\">Annuler<\u002Fbutton>\n          <button onclick=\"{{ saveModal }}\" style=\"padding: 10px 22px; border: none; background: #232B49; color: #FFFFFF; border-radius: 9px; font-size: 14px; font-weight: 700; cursor: pointer;\" style-hover=\"background: #2E3A5F;\" style-active=\"transform: translateY(1px);\">{{ modalCta }}<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  state = {\n    opSearch: \"\",\n    showMasked: false,\n    selectedId: 1,\n    tranche: \"c3\",\n    tab: \"gfa\",\n    modalOpen: false,\n    editingId: null,\n    form: null,\n    gfa: [\n      { id: 1, organisme: \"Caisse d'Épargne\", commentaires: \"Attestation d'achèvement reçue le 27/07/2018\", envoi: \"2017-06-28\", accord: \"2017-07-18\", attestation: \"2018-07-27\", apport: 120000, statut: \"Levée\", date: \"2017-09-05\" },\n      { id: 2, organisme: \"Crédit Mutuel Arkéa\", commentaires: \"Avenant tranche C3 — extension 4 lots\", envoi: \"2019-02-11\", accord: \"2019-03-02\", attestation: \"\", apport: 45000, statut: \"Accordée\", date: \"2019-03-20\" }\n    ],\n    conds: [\n      { id: 1, hf: \"Oui\", taux: \"0,30 %\", periode: \"T3 2017 → T3 2018\", duree: \"12 mois\", commentaires: \"Taux révisé après accord — barème coopératif\" }\n    ],\n    reducs: [\n      { id: 1, montant: 8400, date: \"12/04/2018\" },\n      { id: 2, montant: 2150, date: \"03/09/2018\" }\n    ]\n  };\n\n  operations = [\n    { id: 1, nom: \"Les Palomas\", commune: \"Acigné\" },\n    { id: 2, nom: \"Gardenia\", commune: \"Acigné\" },\n    { id: 3, nom: \"Bel Air\", commune: \"Auray\" },\n    { id: 4, nom: \"Le Garrec\", commune: \"Auray\" },\n    { id: 5, nom: \"Ar Men\", commune: \"Betton\" },\n    { id: 6, nom: \"Les Cardinales\", commune: \"Betton\" },\n    { id: 7, nom: \"Le Plessis\", commune: \"Betton\" },\n    { id: 8, nom: \"Le Clos Métairie\", commune: \"Brécé\" },\n    { id: 9, nom: \"Cocon\", commune: \"Breteil\" },\n    { id: 10, nom: \"Papillons\", commune: \"Breteil\" },\n    { id: 11, nom: \"Bruz Archipel\", commune: \"Bruz\" },\n    { id: 12, nom: \"Kreiz'en\", commune: \"Bruz\" },\n    { id: 13, nom: \"L'Estran\", commune: \"Cancale\" },\n    { id: 14, nom: \"Bellevue\", commune: \"Carnac\" },\n    { id: 15, nom: \"Aldea\", commune: \"Cesson-Sévigné\" },\n    { id: 16, nom: \"Villa Amalfi\", commune: \"Cesson-Sévigné\" },\n    { id: 17, nom: \"Hallouvry\", commune: \"Chantepie\" },\n    { id: 18, nom: \"Au Naturel\", commune: \"Chantepie\" }\n  ];\n\n  tabDefs = [\n    { key: \"adminPsla\", label: \"Admin PSLA\" },\n    { key: \"contratsPsla\", label: \"Contrats PSLA\" },\n    { key: \"finPsla\", label: \"Financements PSLA\" },\n    { key: \"fin\", label: \"Financements\" },\n    { key: \"gfa\", label: \"GFA\" },\n    { key: \"pret1\", label: \"Suivi Prêt 1 %\" }\n  ];\n\n  emptyForm() {\n    return { organisme: \"Caisse d'Épargne\", commentaires: \"\", envoi: \"\", accord: \"\", attestation: \"\", apport: \"\", statut: \"En cours\", date: \"\" };\n  }\n\n  fmtDate(iso) {\n    if (!iso) return \"—\";\n    const [y, m, d] = iso.split(\"-\");\n    return d + \"/\" + m + \"/\" + y;\n  }\n\n  fmtEuro(n) {\n    if (!n) return \"—\";\n    return new Intl.NumberFormat(\"fr-FR\").format(n) + \" €\";\n  }\n\n  badge(statut) {\n    switch (statut) {\n      case \"En cours\": return { bg: \"#FBEFD3\", fg: \"#8A6413\" };\n      case \"Accordée\": return { bg: \"#E3EAF6\", fg: \"#2E4A7A\" };\n      case \"Levée\": return { bg: \"#E2F0E5\", fg: \"#2E6B44\" };\n      default: return { bg: \"#EFEDE6\", fg: \"#5A5F73\" };\n    }\n  }\n\n  renderVals() {\n    const s = this.state;\n    const q = s.opSearch.trim().toLowerCase();\n    const ops = this.operations.filter(o => !q || o.nom.toLowerCase().includes(q) || o.commune.toLowerCase().includes(q));\n    const selected = this.operations.find(o => o.id === s.selectedId) || this.operations[0];\n\n    const opList = ops.map(o => {\n      const active = o.id === s.selectedId;\n      return {\n        ...o,\n        bg: active ? \"#232B49\" : \"transparent\",\n        hoverBg: active ? \"#232B49\" : \"#EFEDE6\",\n        fg: active ? \"#FFFFFF\" : \"#232B49\",\n        subFg: active ? \"#F5B841\" : \"#9A97A8\",\n        onSelect: () => this.setState({ selectedId: o.id })\n      };\n    });\n\n    const tabs = this.tabDefs.map(t => {\n      const active = t.key === s.tab;\n      return {\n        label: t.label,\n        weight: active ? 700 : 500,\n        fg: active ? \"#232B49\" : \"#7A7E8F\",\n        underline: active ? \"#F5B841\" : \"transparent\",\n        onClick: () => this.setState({ tab: t.key })\n      };\n    });\n    const activeTab = this.tabDefs.find(t => t.key === s.tab);\n\n    const gfaRows = s.gfa.map(g => {\n      const b = this.badge(g.statut);\n      return {\n        ...g,\n        envoi: this.fmtDate(g.envoi),\n        accord: this.fmtDate(g.accord),\n        attestation: this.fmtDate(g.attestation),\n        date: this.fmtDate(g.date),\n        apport: this.fmtEuro(g.apport),\n        commentaires: g.commentaires || \"—\",\n        badgeBg: b.bg, badgeFg: b.fg,\n        onEdit: () => this.setState({ modalOpen: true, editingId: g.id, form: { ...g, apport: String(g.apport || \"\") } }),\n        onDelete: () => this.setState({ gfa: s.gfa.filter(x => x.id !== g.id) })\n      };\n    });\n\n    const editing = s.editingId != null;\n    const totalReduc = s.reducs.reduce((sum, r) => sum + r.montant, 0);\n\n    return {\n      opSearch: s.opSearch,\n      onOpSearch: (e) => this.setState({ opSearch: e.target.value }),\n      showMasked: s.showMasked,\n      onShowMasked: (e) => this.setState({ showMasked: e.target.checked }),\n      opCount: ops.length,\n      opList,\n      opTitle: selected.nom + \" — \" + selected.commune,\n      tranche: s.tranche,\n      onTranche: (e) => this.setState({ tranche: e.target.value }),\n      tabs,\n      isGfa: s.tab === \"gfa\",\n      isOtherTab: s.tab !== \"gfa\",\n      activeTabLabel: activeTab ? activeTab.label : \"\",\n      gfaRows,\n      gfaEmpty: s.gfa.length === 0,\n      condRows: s.conds,\n      reducRows: s.reducs.map(r => ({ ...r, montant: this.fmtEuro(r.montant) })),\n      reducTotal: this.fmtEuro(totalReduc) + \" au total\",\n\n      modalOpen: s.modalOpen,\n      modalKicker: editing ? \"Admin GFA\" : \"Admin GFA — nouvelle ligne\",\n      modalTitle: editing ? \"Modifier la GFA\" : \"Nouvelle GFA\",\n      modalCta: editing ? \"Enregistrer\" : \"Créer\",\n      form: s.form || this.emptyForm(),\n      openNewGfa: () => this.setState({ modalOpen: true, editingId: null, form: this.emptyForm() }),\n      closeModal: () => this.setState({ modalOpen: false }),\n      stopProp: (e) => e.stopPropagation(),\n      saveModal: () => {\n        const f = s.form || this.emptyForm();\n        const clean = { ...f, apport: parseInt(f.apport, 10) || 0 };\n        if (editing) {\n          this.setState({ gfa: s.gfa.map(g => g.id === s.editingId ? { ...g, ...clean } : g), modalOpen: false });\n        } else {\n          const id = Math.max(0, ...s.gfa.map(x => x.id)) + 1;\n          this.setState({ gfa: [...s.gfa, { ...clean, id }], modalOpen: false });\n        }\n      },\n      onFormOrganisme: (e) => this.setForm(\"organisme\", e.target.value),\n      onFormStatut: (e) => this.setForm(\"statut\", e.target.value),\n      onFormEnvoi: (e) => this.setForm(\"envoi\", e.target.value),\n      onFormAccord: (e) => this.setForm(\"accord\", e.target.value),\n      onFormAttestation: (e) => this.setForm(\"attestation\", e.target.value),\n      onFormApport: (e) => this.setForm(\"apport\", e.target.value),\n      onFormDate: (e) => this.setForm(\"date\", e.target.value),\n      onFormCommentaires: (e) => this.setForm(\"commentaires\", e.target.value)\n    };\n  }\n\n  setForm(key, value) {\n    this.setState({ form: { ...(this.state.form || this.emptyForm()), [key]: value } });\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
